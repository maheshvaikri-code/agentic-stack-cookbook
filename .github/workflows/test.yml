name: recipes execute

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday run so dependency drift turns the badge red

jobs:
  run-recipes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute every recipe in check mode
        run: |
          set -e
          found=0
          for r in recipes/*/pipeline.py; do
            found=1
            echo "::group::$r"
            python "$r" --check
            echo "::endgroup::"
          done
          test "$found" = "1"
